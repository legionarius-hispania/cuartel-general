name: Deploy tablet PWA to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'app/tablet/**'
      - 'app/shared/**'
      - 'tools/build_html.py'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generar app/tablet/index.html desde app/shared/app_logic.js
        run: python tools/build_html.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar contenido (carpeta app/tablet)
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/tablet

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
